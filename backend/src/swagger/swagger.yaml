openapi: 3.0.0

info:
  title: Society Mobile API
  version: 1.0.0
  description: |
    API documentation cho ứng dụng Society.

    ## Realtime Chat (Socket.IO)
    Chat dùng **Socket.IO** (không phải REST), kết nối tới `http://localhost:3000`.
    Xác thực bằng JWT khi handshake:
    ```js
    const socket = io("http://localhost:3000", { auth: { token: "<JWT>" } });
    ```
    Các REST endpoint dưới mục **Chat** chỉ phục vụ load lịch sử / cấu hình; còn việc
    gửi/nhận tin nhắn realtime đi qua các sự kiện socket sau:

    **Client → Server (emit):**
    - `message:send` — `{ conversationId, text?, replyTo?, mediaUrl?, mediaType? }`
    - `message:react` — `{ messageId, emoji }` (emoji ∈ ❤️ 😆 😮 😢 😡 👍, toggle)
    - `message:delete` — `{ messageId }` (thu hồi, chỉ người gửi)
    - `typing:start` / `typing:stop` — `{ conversationId }`
    - `users:online` — (không payload) yêu cầu danh sách user online

    **Server → Client (on):**
    - `message:new` — message đã populate (gửi tới mọi thành viên trong room)
    - `message:reacted` — `{ messageId, reactions }`
    - `message:deleted` — `{ messageId, conversationId }`
    - `typing:start` / `typing:stop` — `{ conversationId, userId, username? }`
    - `user:online` / `user:offline` — `{ userId }`
    - `users:online` — `{ onlineUsers: string[] }`
    - `error` — `{ message }`

servers:
  - url: http://localhost:3000/api
    description: Local server (mọi path bên dưới đã được hiểu là có tiền tố /api)

tags:
  - name: Auth
    description: Quản lý xác thực
  - name: Friend
    description: Quản lý bạn bè
  - name: Post
    description: Quản lý bài viết (Bảng tin)
  - name: Search
    description: Tìm kiếm & Xu hướng (Trending)
  - name: Document
    description: Quản lý tài liệu học tập
  - name: Group
    description: Quản lý hội nhóm
  - name: Chat
    description: Quản lý tin nhắn

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    User:
      type: object
      properties:
        id: { type: string }
        username: { type: string }
        email: { type: string }
        dateOfBirth: { type: string, nullable: true }
        gender: { type: string, nullable: true }
        avatar: { type: string, nullable: true }
        bio: { type: string, nullable: true }
        isVerified: { type: boolean }
        createdAt: { type: string, format: date-time }

    Post:
      type: object
      properties:
        _id: { type: string }
        authorId:
          $ref: '#/components/schemas/User'
        groupId: { type: string, nullable: true }
        content: { type: string }
        privacy: 
          type: string
          enum: [Public, Private, Friends]
        hashtags:
          type: array
          items: { type: string }
        images:
          type: array
          items: { type: string }
        countReaction: { type: integer }
        countComment: { type: integer }
        createdAt: { type: string, format: date-time }

    Document:
      type: object
      properties:
        _id: { type: string }
        title: { type: string }
        description: { type: string }
        fileType: { type: string }
        visibility: { type: string }
        url: { type: string }

    Group:
      type: object
      properties:
        _id: { type: string }
        groupName: { type: string }
        avatarUrl: { type: string, nullable: true }
        privacy:
          type: string
          enum: [Public, Private]
        newPostCount:
          type: integer
          description: Số bài viết mới trong 7 ngày gần nhất
        lastUpdated: { type: string, format: date-time }

    GroupDetail:
      type: object
      properties:
        _id: { type: string }
        groupName: { type: string }
        description: { type: string, nullable: true }
        avatarUrl: { type: string, nullable: true }
        coverUrl: { type: string, nullable: true }
        privacy:
          type: string
          enum: [Public, Private]
        memberCount: { type: integer }
        isMember: { type: boolean }
        isAdmin: { type: boolean }
        createdAt: { type: string, format: date-time }

    GroupMember:
      type: object
      properties:
        userId: { type: string }
        username: { type: string }
        avatar: { type: string, nullable: true }
        role:
          type: string
          enum: [admin, member]
        joinAt: { type: string, format: date-time }

    GroupInvitation:
      type: object
      properties:
        _id: { type: string }
        group:
          type: object
          properties:
            _id: { type: string }
            groupName: { type: string }
            avatarUrl: { type: string, nullable: true }
        inviter:
          type: object
          properties:
            _id: { type: string }
            username: { type: string }
            avatar: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }

    Conversation:
      type: object
      properties:
        _id: { type: string }
        members:
          type: array
          items:
            $ref: '#/components/schemas/User'
        lastMessage:
          $ref: '#/components/schemas/Message'
        color: { type: string, nullable: true }
        nicknames:
          type: object
          additionalProperties:
            type: string
        updatedAt: { type: string, format: date-time }

    Message:
      type: object
      properties:
        _id: { type: string }
        conversationId: { type: string }
        sender:
          $ref: '#/components/schemas/User'
        text: { type: string }
        mediaUrl: { type: string, nullable: true }
        mediaType: { type: string, nullable: true }
        replyTo: { type: object, nullable: true }
        reactions:
          type: array
          items:
            type: object
            properties:
              userId: { type: string }
              emoji: { type: string }
        isDeleted: { type: boolean }
        createdAt: { type: string, format: date-time }

paths:

  # ================= AUTH =================
  /auth/register:
    post:
      summary: Đăng ký tài khoản
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, email, password]
              properties:
                username: { type: string }
                email: { type: string }
                password: { type: string }
                dateOfBirth: { type: string }
                gender: { type: string }
      responses:
        201:
          description: Đăng ký thành công

  /auth/login:
    post:
      summary: Đăng nhập
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string }
                password: { type: string }
      responses:
        200:
          description: Đăng nhập thành công

  /auth/refresh-token:
    post:
      summary: Làm mới token
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                refreshToken: { type: string }
      responses:
        200:
          description: Thành công

  /auth/logout:
    post:
      summary: Đăng xuất
      tags: [Auth]
      security:
        - bearerAuth: []
      responses:
        200:
          description: Đăng xuất thành công

  /auth/me:
    get:
      summary: Lấy thông tin user hiện tại
      tags: [Auth]
      security:
        - bearerAuth: []
      responses:
        200:
          description: OK

  # ================= FRIEND =================
  /friends:
    get:
      tags: [Friend]
      summary: Lấy danh sách bạn bè
      security:
        - bearerAuth: []
      responses:
        200:
          description: Thành công

  /friends/pending:
    get:
      tags: [Friend]
      summary: Lấy danh sách lời mời kết bạn
      security:
        - bearerAuth: []
      responses:
        200:
          description: Thành công

  /friends/suggestions:
    get:
      tags: [Friend]
      summary: Gợi ý kết bạn
      security:
        - bearerAuth: []
      responses:
        200:
          description: Thành công

  /friends/status/{id}:
    get:
      tags: [Friend]
      summary: Kiểm tra trạng thái bạn bè
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        200:
          description: Trạng thái

  /friends/request/{id}:
    post:
      tags: [Friend]
      summary: Gửi lời mời kết bạn
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        201:
          description: Gửi thành công

  /friends/accept/{id}:
    put:
      tags: [Friend]
      summary: Chấp nhận lời mời
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        200:
          description: Đã chấp nhận

  /friends/decline/{id}:
    delete:
      tags: [Friend]
      summary: Từ chối lời mời
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        200:
          description: Đã từ chối

  /friends/remove/{id}:
    delete:
      tags: [Friend]
      summary: Huỷ kết bạn
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        200:
          description: Đã huỷ kết bạn

  # ================= POST (THÊM MỚI THEO YÊU CẦU) =================
  /posts/create:
    post:
      tags: [Post]
      summary: Đăng bài viết mới
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                content: { type: string }
                privacy: { type: string, enum: [Public, Private, Friends] }
                groupId: { type: string }
                images: 
                  type: array
                  items: { type: string, format: binary }
      responses:
        201:
          description: Đăng bài thành công

  /posts/feed:
    get:
      tags: [Post]
      summary: Lấy bảng tin (News Feed)
      security:
        - bearerAuth: []
      responses:
        200:
          description: Lấy Feed thành công
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Post'

  /posts/me:
    get:
      tags: [Post]
      summary: Lấy bài viết của chính tôi
      security:
        - bearerAuth: []
      responses:
        200:
          description: Thành công

  /posts/{id}:
    get:
      tags: [Post]
      summary: Lấy chi tiết 1 bài viết
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        200:
          description: Thành công
    delete:
      tags: [Post]
      summary: Xoá bài viết
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        200:
          description: Xóa thành công

  /posts/{id}/save:
    post:
      tags: [Post]
      summary: Lưu / Bỏ lưu bài viết
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        200:
          description: Thành công

  /posts/my/saved:
    get:
      tags: [Post]
      summary: Lấy danh sách bài viết đã lưu
      security:
        - bearerAuth: []
      responses:
        200:
          description: Thành công

  # ================= SEARCH & TRENDING (THÊM MỚI THEO YÊU CẦU) =================
  /search/trending:
    get:
      tags: [Search]
      summary: Lấy danh sách Top 10 Trending Hashtags (Trong 7 ngày qua)
      security:
        - bearerAuth: []
      responses:
        200:
          description: Lấy danh sách xu hướng thành công
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        name: { type: string, example: "#UIT" }
                        mentions: { type: integer, example: 1240 }

  /search/results:
    get:
      tags: [Search]
      summary: Tìm kiếm tổng hợp (Posts, Users, Groups)
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: q
          schema: { type: string }
          description: Từ khóa tìm kiếm tự do
        - in: query
          name: hashtag
          schema: { type: string }
          description: Tìm chính xác theo Hashtag (vd %23ToanRoiRac)
      responses:
        200:
          description: Trả về kết quả tìm kiếm gồm posts, users, groups

  # ================= DOCUMENT =================
  /documents:
    post:
      tags: [Document]
      summary: Tạo tài liệu mới
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Document'
      responses:
        201:
          description: Tạo thành công
    get:
      tags: [Document]
      summary: Lấy danh sách tài liệu public
      responses:
        200:
          description: Thành công

  /documents/{id}:
    get:
      tags: [Document]
      summary: Lấy chi tiết tài liệu
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        200:
          description: Thành công
    patch:
      tags: [Document]
      summary: Cập nhật tài liệu
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        200:
          description: Thành công
    delete:
      tags: [Document]
      summary: Xoá tài liệu
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        200:
          description: Thành công

  /documents/{id}/download:
    post:
      tags: [Document]
      summary: Tăng lượt download
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        200:
          description: Thành công

  # ================= GROUP =================
  /groups/my:
    get:
      tags: [Group]
      summary: Danh sách nhóm của tôi
      security:
        - bearerAuth: []
      responses:
        200:
          description: Thành công

  /groups:
    post:
      tags: [Group]
      summary: Tạo nhóm mới
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                groupName: { type: string }
                description: { type: string }
                privacy: { type: string, enum: [Public, Private] }
                avatar: { type: string, format: binary }
      responses:
        201:
          description: Tạo nhóm thành công

  /groups/{groupId}:
    get:
      tags: [Group]
      summary: Chi tiết nhóm
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: groupId
          required: true
          schema: { type: string }
      responses:
        200:
          description: Thành công

  /groups/{groupId}/join:
    post:
      tags: [Group]
      summary: Tham gia nhóm Public
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: groupId
          required: true
          schema: { type: string }
      responses:
        200:
          description: Tham gia thành công

  /groups/{groupId}/members:
    get:
      tags: [Group]
      summary: Danh sách thành viên nhóm
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: groupId
          required: true
          schema: { type: string }
      responses:
        200:
          description: Thành công

  # ================= CHAT (REST) =================
  /chat/conversations:
    get:
      tags: [Chat]
      summary: Danh sách cuộc trò chuyện của tôi
      security:
        - bearerAuth: []
      responses:
        200:
          description: Thành công

    post:
      tags: [Chat]
      summary: Lấy hoặc tạo cuộc trò chuyện 1-1
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                targetUserId: { type: string }
      responses:
        200:
          description: Thành công

  /chat/conversations/{conversationId}/messages:
    get:
      tags: [Chat]
      summary: Lấy tin nhắn trong cuộc trò chuyện (phân trang)
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: conversationId
          required: true
          schema: { type: string }
      responses:
        200:
          description: Thành công